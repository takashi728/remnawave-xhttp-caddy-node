services:
  caddy:
    image: caddy:2.11.3
    container_name: remnawave-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./selfsteal:/srv/selfsteal:ro
      - ./certs:/etc/caddy/certs:ro
      - ./caddy_data:/data
      - ./caddy_config:/config

  fallback-web:
    image: vectorim/element-web:v1.12.18
    container_name: remnawave-fallback-element
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./element-web/config.json:/app/config.json:ro

  remnanode:
    image: remnawave/node:latest
    container_name: remnanode
    hostname: remnanode
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      NODE_PORT: "2222"
      SECRET_KEY: "${SECRET_KEY}"
    volumes:
      - ./certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./certs/privkey.key:/etc/nginx/certs/privkey.key:ro
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
