services:
  caddy:
    image: caddy:2.11.9
    container_name: remnawave-caddy
    restart: unless-stopped
    network_mode: host
    environment:
      GODEBUG: "multipathtcp=0"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./selfsteal:/srv/selfsteal:ro
      - ./certs:/etc/caddy/certs:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
      - /dev/shm:/dev/shm

  fallback-web:
    image: vectorim/element-web:v1.12.36
    container_name: remnawave-fallback-element
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./element-web/config.json:/app/config.json:ro

  remnanode:
    image: remnawave/node:3.4.6
    container_name: remnanode
    hostname: remnanode
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      NODE_PORT: "${NODE_PORT:-2222}"
      SECRET_KEY: "${SECRET_KEY}"
      SNI_VERIFICATION: "${SNI_VERIFICATION:-false}"
      NFTABLES_TABLE_NAME: "${NFTABLES_TABLE_NAME:-remnanode}"
      SUPPRESS_DUPLICATE_INSTANCE_WARNING: "${SUPPRESS_DUPLICATE_INSTANCE_WARNING:-false}"
      CUSTOM_CORE_URL: "${CUSTOM_CORE_URL:-}"
    volumes:
      - ./certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./certs/privkey.key:/etc/nginx/certs/privkey.key:ro
      - /dev/shm:/dev/shm
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
