<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202124;
      background: #f8fafc;
    }
    main {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    section {
      max-width: 680px;
      width: 100%;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      font-weight: 650;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: #5f6368;
      line-height: 1.55;
    }

</head>
<body>
  <main>
    <section>
      <h1>Service online</h1>
      <p>This endpoint is operating normally.</p>
    </section>
  </main>
</body>
</html>
